name: Diagnostica live (temporanea)

# Usa-e-getta: dal container di sviluppo non c'e' accesso in uscita verso i
# domini di Praxisy, quindi non si puo' verificare da li' che www.praxisy.org
# serva davvero l'app. Qui la rete c'e'. Va rimosso dopo l'uso.

on:
  workflow_dispatch:
  push:
    branches: [claude/praxisy-govtech-redesign-a0tcge]

jobs:
  guarda:
    runs-on: ubuntu-latest
    steps:
      - name: www.praxisy.org — risponde e serve l'app?
        run: |
          set +e
          for U in https://www.praxisy.org/ https://praxisy.org/; do
            echo "=============== $U"
            echo "codice senza seguire i redirect: $(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$U")"
            echo "destinazione finale: $(curl -sS -m 20 -L -o /dev/null -w '%{http_code} %{url_effective} (redirect: %{num_redirects})' "$U")"
            curl -sS -m 20 -L "$U" -o /tmp/pag.html
            echo "byte: $(wc -c < /tmp/pag.html)"
            echo -n "title: "; grep -o '<title[^>]*>[^<]*' /tmp/pag.html | head -1
            echo -n "canonical: "; grep -o '<link rel="canonical"[^>]*>' /tmp/pag.html | head -1
            echo "e' l'app (sw.js/manifest): $(grep -c 'sw\.js\|manifest\.json' /tmp/pag.html)"
            echo "e' il sito vetrina (pricing.html): $(grep -c 'pricing\.html' /tmp/pag.html)"
            echo "pagina di errore Netlify: $(grep -ci 'Page not found\|Site not found' /tmp/pag.html)"
          done
      - name: praxisy.info — il deploy e' ripartito?
        run: |
          set +e
          curl -sS -m 20 https://praxisy.info/praxisy.js -o /tmp/p.js
          echo "praxisy.js byte: $(wc -c < /tmp/p.js) (9047 = versione del 16 settembre, 10305 = aggiornata)"
          echo "handler link esterni: $(grep -c 'Link esterni' /tmp/p.js)"
          curl -sS -m 20 https://praxisy.info/ -o /tmp/i.html
          echo "--- bottoni nav pubblicati:"
          grep -o '<a href="[^"]*"[^>]*class="btn btn-primary nav-demo[^"]*"[^>]*>[^<]*' /tmp/i.html | head -2
